name: Otomatik testler

# Her gönderimde, her çekme isteğinde ve her gün 06:17 (UTC) bütün oyun sistemi denetlenir.
# Bir denetim bile başarısız olursa iş kırmızı yanar ve GitHub depo sahibine e-posta ile uyarı gönderir
# (GitHub > Settings > Notifications > Actions: "Only notify for failed workflows" açık olmalı).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  birim:
    name: Kurallar, tür denetimi ve birim testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm --prefix functions ci
      - name: Tür denetimi (oyun ve sunucu)
        run: npx tsc --noEmit -p . && (cd functions && npx tsc --noEmit -p .)
      - name: Birim testleri (kurallar, 7 dilde bilgisayar maçları, masalar ve ödüller, filtreler)
        run: npm test
      - name: Paralel test parçaları eksiksiz mi
        run: node tests/check-parts.cjs
      - name: Derleme
        run: npm run build

  sunucu:
    name: Sunucu testleri (Firebase emülatörü) ${{ matrix.part }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: "1/2"
            files: tests/emulator/account.mjs tests/emulator/admin.mjs tests/emulator/fiftycent.mjs tests/emulator/blocks.mjs tests/emulator/chat.mjs tests/emulator/entries.mjs tests/emulator/cayhane.mjs tests/emulator/gifts.mjs tests/emulator/idle.mjs tests/emulator/invites.mjs
          - part: "2/2"
            files: tests/emulator/carli.mjs tests/emulator/rate.mjs tests/emulator/refill.mjs tests/emulator/social.mjs tests/emulator/tables.mjs tests/emulator/usta.mjs tests/emulator/vip.mjs tests/emulator/vipcarli.mjs tests/emulator/wallet.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm --prefix functions run build
      - name: Kumbara, masalar, VIP, sohbet, hediye, arkadaş, davet, engelleme, hesap, yönetici
        run: bash tests/emulator/run-all.sh ${{ matrix.files }}

  tarayici:
    name: Uçtan uca testler (gerçek tarayıcıda oyun) ${{ matrix.part }}
    runs-on: ubuntu-latest
    # Dört parça aynı anda çalışır (tests/e2e/run.cjs içindeki PARTS):
    # A: 7 dil × 4 ekran · B: kelime uzunlukları · C: masalar, ödemeler, tam oyunlar · D: ayarlar, kurallar, giriş şartları, sohbet, süre
    strategy:
      fail-fast: false
      matrix:
        part: [A, B, C, D]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright@1.63.0 install --with-deps chromium
      - run: npm i --no-save playwright@1.63.0
      - run: npm run build
      - name: Oyunu başlat ve denetle (parça ${{ matrix.part }})
        env:
          E2E_PART: ${{ matrix.part }}
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node tests/e2e/run.cjs

  cevrimici:
    name: Çevrimiçi oyun (iki gerçek tarayıcı + sunucu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm --prefix functions run build
      - run: npx playwright@1.63.0 install --with-deps chromium
      - run: npm i --no-save playwright@1.63.0
      - name: Çevrimiçi sürümü derle (emülatöre bağlanır)
        run: VITE_FIREBASE_EMULATOR=1 npx vite build --outDir dist-online
      - name: İki oyuncu aynı masada; hamle eşzamanlılığı, emoji, yenileme, süre, çıkış, Sosyete sohbeti ve küfür filtresi
        run: |
          npx vite preview --outDir dist-online --host 127.0.0.1 --port 4174 --strictPort &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4174/ >/dev/null && break; sleep 1; done
          npx firebase emulators:exec --project demo-cinali --only auth,firestore,functions "node tests/e2e/online.cjs"

  uyari:
    name: Hata e-postası
    # Testlerden biri başarısız olursa e-posta gönderilir. Gerekli gizli anahtarlar
    # (Settings > Secrets and variables > Actions > Secrets):
    #   MAIL_USERNAME  gönderen Gmail adresi
    #   MAIL_PASSWORD  o Gmail hesabının "uygulama şifresi" (normal şifre değil)
    #   ALERT_EMAIL    uyarının gideceği adres
    # Tanımlı değilse bu adım atlanır; GitHub'ın kendi bildirim e-postası yine gider.
    needs: [birim, sunucu, tarayici, cevrimici]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    env:
      HAS_MAIL: ${{ secrets.MAIL_USERNAME != '' && secrets.MAIL_PASSWORD != '' && secrets.ALERT_EMAIL != '' }}
    steps:
      - name: E-posta ayarı yoksa bildir
        if: env.HAS_MAIL != 'true'
        run: echo "::warning::Hata e-postası için MAIL_USERNAME, MAIL_PASSWORD ve ALERT_EMAIL gizli anahtarları tanımlı değil."
      - name: Uyarı e-postası gönder
        if: env.HAS_MAIL == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.ALERT_EMAIL }}
          from: Word Okey Testleri <${{ secrets.MAIL_USERNAME }}>
          subject: "⚠️ Word Okey: otomatik testlerde hata (${{ github.event_name }})"
          body: |
            Word Okey otomatik testlerinde hata bulundu.

            Kurallar ve birim testleri: ${{ needs.birim.result }}
            Sunucu testleri: ${{ needs.sunucu.result }}
            Tarayıcı (uçtan uca) testleri: ${{ needs.tarayici.result }}
            Çevrimiçi oyun testi: ${{ needs.cevrimici.result }}

            Değişiklik: ${{ github.sha }}
            Ayrıntılar: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
