<svg xmlns="http://www.w3.org/2000/svg" viewBox="44 6 124 206">
  <!-- Word Okey okey taşı karakteri: mavi şapkalı, küçük kırmızı bağcıklı ayakkabılı çöp adam;
       Özgürlük Anıtı'ndaki tablet gibi kolunda alfabe kitabı taşır -->
  <g fill="none" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- gövde -->
    <path d="M104 78 Q100 110 98 142"/>
    <!-- sol kol (aşağıda) -->
    <path d="M102 92 L78 114 L62 136"/>
    <path d="M62 136 l-7 4 M62 136 l-3 8 M62 136 l3 7" stroke-width="4"/>
    <!-- bacaklar (dans adımı) -->
    <path d="M98 142 L80 172 L74 194"/>
    <path d="M98 142 L118 168 L128 192"/>
    <!-- sağ üst kol: dirsek kalçaya doğru iner -->
    <path d="M102 92 L114 128"/>
  </g>

  <!-- alfabe kitabı: anıttaki tablet gibi, ön kola yaslı ve hafif eğik -->
  <g transform="rotate(-12 134 104)">
    <rect x="118" y="80" width="32" height="44" rx="3" fill="#2e7d32" stroke="#14451a" stroke-width="3"/>
    <rect x="118" y="80" width="6" height="44" rx="2" fill="#1b5e20"/>
    <rect x="148" y="83" width="3" height="38" fill="#fff8e1" stroke="#14451a" stroke-width="1"/>
    <text y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="15"
          stroke="#ffffff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">
      <tspan x="124" fill="#1565c0">A</tspan><tspan x="134" fill="#d32f2f">B</tspan><tspan x="143" fill="#f9a825">C</tspan>
    </text>
  </g>

  <!-- sağ ön kol ve el: kitabın alt köşesini kavrar -->
  <g fill="none" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M114 128 L136 122"/>
    <path d="M136 122 l5 -6 M136 122 l7 -2" stroke-width="4"/>
  </g>

  <!-- kafa -->
  <path d="M90 50 Q88 30 108 28 Q126 28 128 44 L134 52 L128 55 Q129 66 120 72 Q108 78 98 72 Q90 64 90 50 Z"
        fill="#f8d9b4" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="119" cy="47" r="3.2" fill="#1a1a1a"/>
  <path d="M112 62 Q119 66 125 60" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <!-- mavi şapka (siperlik öne) -->
  <path d="M86 44 Q86 16 112 14 Q134 14 136 36 Z" fill="#1e63c8" stroke="#0d3c80" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M120 34 Q142 30 156 38 Q144 44 124 42 Z" fill="#1e63c8" stroke="#0d3c80" stroke-width="3.5" stroke-linejoin="round"/>
  <circle cx="110" cy="14" r="4.5" fill="#0d3c80"/>
  <path d="M96 22 Q108 18 120 22" fill="none" stroke="#5c9cff" stroke-width="3" stroke-linecap="round"/>

  <!-- küçük kırmızı bağcıklı ayakkabılar -->
  <g transform="translate(74 197) scale(0.62) translate(-70 -199)">
    <path d="M58 196 Q58 188 68 188 L78 190 Q86 194 86 202 L86 206 L56 206 Q52 206 54 200 Z" fill="#e02424" stroke="#7a0b0b" stroke-width="3" stroke-linejoin="round"/>
    <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round">
      <path d="M64 196 L72 191 M64 191 L72 196"/>
      <path d="M70 190 q-7 -7 -9 -1 q3 4 9 1 q7 -7 9 -1 q-3 4 -9 1"/>
    </g>
    <path d="M54 208 L87 208" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(130 195) scale(0.62) translate(-138 -199)">
    <path d="M122 194 Q124 188 132 188 L140 190 Q154 194 156 202 L156 206 L124 206 Q120 206 121 200 Z" fill="#e02424" stroke="#7a0b0b" stroke-width="3" stroke-linejoin="round"/>
    <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round">
      <path d="M128 196 L136 191 M128 191 L136 196"/>
      <path d="M134 190 q-7 -7 -9 -1 q3 4 9 1 q7 -7 9 -1 q-3 4 -9 1"/>
    </g>
    <path d="M120 208 L157 208" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
